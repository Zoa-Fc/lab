
<script>
    if (localStorage.getItem("serverShutdown") === "true") {
        document.addEventListener("DOMContentLoaded", function() {
            document.body.innerHTML = "<h1 style='text-align:center; margin-top:50px;'>Server is down</h1>";
        });
    }
</script>


<title>Create Account</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">



<link rel="stylesheet" href="CSS/login.css">

<h1 class="login">
    Create Account
</h1>

<form onsubmit="handleCreateAccount(event)">
    <input type="text" id="username" name="username" placeholder="Username" required>
    
    <input type="password" id="password" name="password" placeholder="Password" required>
    
    <button type="submit">CREATE</button>
    
    <p id="success-message" style="color: green; text-align: center; margin-top: 10px;"></p>

<script src="backend/create.js"></script>

</form>
